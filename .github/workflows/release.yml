name: Release

# A pushed v* tag builds the release assets and publishes them to the GitHub
# release for that tag. A manual dispatch, or a pull request against main,
# builds the same assets and keeps them only as a workflow artifact; neither
# creates or edits a release (the publish job runs only for tag pushes).
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v. Must equal addons/haiven/plugin.cfg. Empty uses plugin.cfg's version.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Superseded pull-request builds can stop; tag builds always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Haiven.Godot.csproj references ../haiven-sdk-unity/core/Haiven.Sdk.Core.csproj,
  # which compiles ../../haiven-sdk-dotnet/Haiven.Sdk/*.cs. Both are public
  # repositories; the release builds against these exact commits. Bump them
  # deliberately, in a reviewed commit, when the shared core changes.
  HAIVEN_SDK_UNITY_REF: bd841fcc4e6a5733eee62b03adc0987f90587a92
  HAIVEN_SDK_DOTNET_REF: 091d450aff56d86f15d7899d55106366e81a810d

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out haiven-sdk-godot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out haiven-sdk-unity (shared core project)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haiven-dev/haiven-sdk-unity
          ref: ${{ env.HAIVEN_SDK_UNITY_REF }}
          path: .release-deps/haiven-sdk-unity
          persist-credentials: false

      - name: Check out haiven-sdk-dotnet (shared core sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haiven-dev/haiven-sdk-dotnet
          ref: ${{ env.HAIVEN_SDK_DOTNET_REF }}
          path: .release-deps/haiven-sdk-dotnet
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(sed -n 's/^version="\(.*\)"$/\1/p' addons/haiven/plugin.cfg)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 ci/package_release.py \
            --version "$VERSION" \
            --out "$RUNNER_TEMP/dist" \
            --sdk-unity .release-deps/haiven-sdk-unity \
            --sdk-dotnet .release-deps/haiven-sdk-dotnet

      - name: List assets
        working-directory: ${{ runner.temp }}/dist
        run: |
          ls -l
          sha256sum -c SHA256SUMS
          for z in *.zip; do
            echo "== $z"
            python3 -m zipfile -l "$z"
          done

      - name: Upload assets as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haiven-sdk-godot-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: haiven-sdk-godot-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum -c SHA256SUMS
          assets=(haiven-godot-addon-"$VERSION".zip haiven-godot-dotnet-"$VERSION".zip SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # release-please (or an earlier run) created the release: attach the
            # assets. release-please creates it as a full release, so mark a
            # pre-release version here and keep it from becoming Latest.
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            case "$VERSION" in
              *-*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false ;;
            esac
          else
            prerelease=()
            case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "haiven-sdk-godot $TAG" \
              --generate-notes \
              "${prerelease[@]}"
          fi
